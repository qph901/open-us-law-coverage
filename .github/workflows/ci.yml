name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests scripts
      - run: uv run mypy src
      - run: uv run pytest --cov=open_us_law_coverage --cov-report=term-missing
      - run: uv build
      - run: git diff --check
