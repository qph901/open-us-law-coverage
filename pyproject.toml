[project]
name = "open-us-law-coverage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "qph901", email = "qph@threemen.com.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "huggingface-hub>=1.28.0",
    "polars>=1.44.0",
    "pyarrow>=25.0.1",
]

[project.scripts]
open-us-law-coverage = "open_us_law_coverage:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
